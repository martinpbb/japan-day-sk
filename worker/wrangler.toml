name = "japanday-workshops-api"
main = "src/worker.js"
workers_dev = false
preview_urls = false
compatibility_date = "2026-10-29"

[vars]
FEEDBACK_ENABLED = "false"
NEWSLETTER_SIGNUP_ENABLED = "false"
NEWSLETTER_TOKEN_ACTIONS_ENABLED = "true"
# Required before opt-in: TURNSTILE_HOSTNAME, TURNSTILE_SECRET_KEY (secret),
# ABUSE_HMAC_SECRET (secret, >=32 characters), SUBMISSION_LIMITER binding.
# Newsletter additionally requires NEWSLETTER_CONSENT_VERSION,
# NEWSLETTER_LINK_ORIGIN and a trusted NEWSLETTER_MAILER service binding.
# No live mail provider/binding exists yet. See docs/notes/phase-3-feedback-newsletter.md.
ACCESS_TEAM_DOMAIN = "twilight-tree-b175.cloudflareaccess.com"
# Set ACCESS_AUD as a Worker secret/var from the Cloudflare Access application.

[[d1_databases]]
binding = "DB"
database_name = "japanday-workshops"
database_id = "26f5af16-c3ee-4768-bf77-3d347c104e9f"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]
