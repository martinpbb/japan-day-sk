name = "japanday-newsletter-mailer-staging"
main = "src/index.js"
workers_dev = false
preview_urls = false
compatibility_date = "2026-10-29"

[vars]
MAIL_FROM_EMAIL = "REPLACE_WITH_AUTHENTICATED_SENDER@example.invalid"
MAIL_FROM_NAME = "Japonský deň čaju a kultúry"
STAGING_ENVIRONMENT = "true"
STAGING_API_HOSTNAME = "REPLACE_WITH_EXACT_STAGING_API_HOSTNAME"

[[d1_databases]]
binding = "DELIVERY_DB"
database_name = "japanday-newsletter-delivery-staging"
database_id = "REPLACE_WITH_STAGING_DELIVERY_D1_ID"
migrations_dir = "migrations"
