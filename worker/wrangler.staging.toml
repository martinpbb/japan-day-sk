name = "japanday-workshops-api-staging"
main = "src/staging.js"
workers_dev = true
preview_urls = false
compatibility_date = "2026-10-29"

[vars]
FEEDBACK_ENABLED = "false"
NEWSLETTER_SIGNUP_ENABLED = "false"
NEWSLETTER_TOKEN_ACTIONS_ENABLED = "false"
TURNSTILE_HOSTNAME = "japanday-sk-web-staging.marzo2k.workers.dev"
STAGING_ALLOWED_ORIGIN = "https://japanday-sk-web-staging.marzo2k.workers.dev"
STAGING_ENVIRONMENT = "true"
# Secrets are configured out of band only after staging resources are approved:
# TURNSTILE_SECRET_KEY, ABUSE_HMAC_SECRET (random, >=32 characters).
# FEEDBACK_ENABLED stays false until the isolated D1 migration and dashboard checks pass.

[[d1_databases]]
binding = "DB"
database_name = "japanday-workshops-staging"
# Deliberately invalid until owner provisions a separate staging D1 database.
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[[ratelimits]]
name = "SUBMISSION_LIMITER"
# Account-unique namespace placeholder; never reuse production's chosen value.
namespace_id = "1002"
[ratelimits.simple]
limit = 60
period = 60
